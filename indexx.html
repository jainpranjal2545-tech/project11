<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pranjal's Web Page</title>
  <!-- Font Awesome for icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #89f7fe, #66a6ff);
      margin: 0;
      padding: 0;
      text-align: center;
      color: #333;
    }

    header {
      padding: 40px;
      background: rgba(255, 255, 255, 0.8);
      border-bottom: 3px solid #444;
    }

    h1 {
      font-size: 3em;
      margin: 0;
    }

    section {
      padding: 40px 20px;
    }

    h2 {
      margin-bottom: 20px;
      color: #222;
    }

    .icons {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 40px;
    }

    .icon-card {
      background: white;
      padding: 20px;
      border-radius: 12px;
      width: 150px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
      transition: 0.3s;
      cursor: pointer;
    }

    .icon-card:hover {
      transform: scale(1.1);
    }

    .icon-card i {
      font-size: 40px;
      color: #0077b6;
      margin-bottom: 10px;
    }

    footer {
      margin-top: 40px;
      padding: 20px;
      background: rgba(0,0,0,0.7);
      color: white;
    }

    /* Music player popup */
    #musicPlayer {
      display: none;
      background: white;
      padding: 20px;
      border-radius: 12px;
      margin-top: 20px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.2);
      max-width: 400px;
      margin-left: auto;
      margin-right: auto;
    }

    #musicPlayer h3 {
      margin-bottom: 15px;
    }

    .track {
      margin: 10px 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #f1f1f1;
      padding: 8px 12px;
      border-radius: 8px;
    }

    .track button {
      background: #0077b6;
      color: white;
      border: none;
      padding: 5px 10px;
      border-radius: 5px;
      cursor: pointer;
    }

    .track button:hover {
      background: #005f8c;
    }
  </style>
</head>
<body>
  <header>
    <h1>👋 Hi, I'm Pranjal</h1>
    <p>Welcome to my personal page</p>
  </header>

  <section>
    <h2>🎯 My Hobbies</h2>
    <div class="icons">
      <!-- Music card -->
      <div class="icon-card" onclick="toggleMusicPlayer()">
        <i class="fas fa-music"></i>
        <p>Music</p>
      </div>
      <div class="icon-card">
        <i class="fas fa-book"></i>
        <p>Reading</p>
      </div>
      <div class="icon-card">
        <i class="fas fa-camera"></i>
        <p>Photography</p>
      </div>
      <div class="icon-card">
        <i class="fas fa-gamepad"></i>
        <p>Gaming</p>
      </div>
    </div>

    <!-- Music player -->
    <div id="musicPlayer">
      <h3>🎵 My Playlist</h3>
      <div class="track">
        <span>Song 1 - Acoustic</span>
        <button onclick="playMusic('https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3')">Play</button>
      </div>
      <div class="track">
        <span>Song 2 - Piano</span>
        <button onclick="playMusic('https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3')">Play</button>
      </div>
      <div class="track">
        <span>Song 3 - Chill Vibes</span>
        <button onclick="playMusic('https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3')">Play</button>
      </div>
      <audio id="audioPlayer" controls style="margin-top:15px; width:100%;"></audio>
    </div>
  </section>

  <section>
    <h2>📌 Details</h2>
    <div class="icons">
      <div class="icon-card">
        <i class="fas fa-user"></i>
        <p>Name: Pranjal</p>
      </div>
      <div class="icon-card">
        <i class="fas fa-graduation-cap"></i>
        <p>Student</p>
      </div>
      <div class="icon-card">
        <i class="fas fa-map-marker-alt"></i>
        <p>India</p>
      </div>
    </div>
  </section>

  <section>
    <h2>⭐ Favorite Things</h2>
    <div class="icons">
      <div class="icon-card">
        <i class="fas fa-film"></i>
        <p>Movies</p>
      </div>
      <div class="icon-card">
        <i class="fas fa-utensils"></i>
        <p>Food</p>
      </div>
      <div class="icon-card">
        <i class="fas fa-plane"></i>
        <p>Travel</p>
      </div>
      <div class="icon-card">
        <i class="fas fa-tree"></i>
        <p>Nature</p>
      </div>
    </div>
  </section>

  <footer>
    <p>Made with ❤️ by Pranjal</p>
  </footer>

  <script>
    function toggleMusicPlayer() {
      const player = document.getElementById("musicPlayer");
      player.style.display = player.style.display === "none" ? "block" : "none";
    }

    function playMusic(src) {
      const audio = document.getElementById("audioPlayer");
      audio.src = src;
      audio.play();
    }
  </script>
</body>
</html>
